name: Discord deploy notice

# Discord's GitHub-compatible webhook endpoint (.../github) accepts deployment
# and deployment_status events but silently drops them, so deploys never show
# up in the channel. Post Vercel's final deploy result to the plain webhook
# instead. DISCORD_DEPLOY_WEBHOOK is the webhook URL without the /github suffix.
#
# Listens to Vercel's commit status rather than deployment_status: since the
# project moved to the BetterPuertoPrincesa Vercel team, Vercel only reports a
# commit status and no longer creates GitHub deployments.
on: status

jobs:
  notify:
    # Only Vercel's final states (skips "pending").
    if: >-
      github.event.context == 'Vercel' &&
      github.event.sender.login == 'vercel[bot]' &&
      contains(fromJSON('["success","failure","error"]'), github.event.state)
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          STATE: ${{ github.event.state }}
          SHA: ${{ github.event.sha }}
          # Branches whose tip is this commit. A merge to main is the
          # production deploy; anything else is a preview.
          BRANCHES: ${{ join(github.event.branches.*.name, ' ') }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK is not set, skipping."
            exit 0
          fi

          # The status links to the Vercel dashboard, which we don't share, so
          # only production gets a link (to the live site).
          DEPLOY_URL=""
          if [[ " $BRANCHES " == *" main "* ]]; then
            ENVIRONMENT=Production
            REF=main
            if [ "$STATE" = "success" ]; then
              DEPLOY_URL=https://betterpuertoprincesa.org
            fi
          else
            ENVIRONMENT=Preview
            REF=${BRANCHES%% *}
            REF=${REF:-unknown}
          fi

          case "$STATE" in
            success) TITLE="$ENVIRONMENT deploy succeeded"; COLOR=3066993 ;;
            *)       TITLE="$ENVIRONMENT deploy failed"; COLOR=15158332 ;;
          esac

          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg url "$DEPLOY_URL" \
            --arg ref "$REF" \
            --arg sha "${SHA:0:7}" \
            --arg commit "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA" \
            '{
              username: "Vercel",
              embeds: [{
                title: $title,
                url: (if $url == "" then null else $url end),
                color: $color,
                fields: [
                  { name: "Branch", value: $ref, inline: true },
                  { name: "Commit", value: "[\($sha)](\($commit))", inline: true }
                ]
              }]
            }' |
            curl -sSf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
